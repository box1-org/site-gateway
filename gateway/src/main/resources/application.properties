quarkus.application.name=gateway
# Fast-jar (target/quarkus-app/), packaged as /gateway/quarkus-app/ in the bundle.
quarkus.package.jar.type=fast-jar
# Modules run side by side in the consumer image: give each its own port at runtime.
quarkus.http.port=${HTTP_PORT:8080}
# Local only: site-ops, greenboot checks and the in-guest collector call the gateway from inside the VM.
quarkus.http.host=${SITE_GATEWAY_HOST:127.0.0.1}
# Tests of different modules may run in parallel; use a random port.
quarkus.http.test-port=0
quarkus.jackson.fail-on-unknown-properties=true

# ---------------------------------------------------------------------------------------------------------------
# Site identity and endpoints (box1-docs#126). systemd passes /etc/box1/site.env (cloud-init, box1-docs#140):
# BOX1_SITE_ID and BOX1_INSTANCE always; the endpoints only when the instance's ConfigMap sets them.
# ---------------------------------------------------------------------------------------------------------------
site.id=${BOX1_SITE_ID}
site.instance=${BOX1_INSTANCE:}
site.kafka.bootstrap-servers=${BOX1_KAFKA_BOOTSTRAP_SERVERS:box1-kafka-kafka-bootstrap.box1-kafka.svc:9092}
site.agent.asset-service-url=${BOX1_ASSET_SERVICE_URL:https://asset-service-dev.apps.ocp.box1.org}
site.agent.token-url=${BOX1_KEYCLOAK_TOKEN_URL:}
site.agent.client-id=${BOX1_KEYCLOAK_CLIENT_ID:}
site.agent.client-secret-file=${BOX1_KEYCLOAK_CLIENT_SECRET_FILE:}

# Site PostgreSQL (digest-pinned quadlet in site-gateway-os, loopback only). The password is generated at first boot
# into a root-owned environment file that systemd passes as SITE_DB_PASSWORD; it is never in Git or the image.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SITE_DB_URL:jdbc:postgresql://127.0.0.1:5432/site}
quarkus.datasource.username=${SITE_DB_USER:site}
quarkus.datasource.password=${SITE_DB_PASSWORD}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=30
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.loginTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.logServerErrorDetail=false
quarkus.datasource.health.enabled=false
quarkus.flyway.migrate-at-start=true
# Wait for PostgreSQL after a boot instead of failing (systemd also restarts the service).
quarkus.flyway.connect-retries=24
quarkus.flyway.connect-retries-interval=5S
quarkus.devservices.enabled=false

# MQTT route: if the broker is down at start, Camel keeps retrying the route instead of failing startup, and the
# gateway reports not ready until it connects.
camel.routecontroller.enabled=true
camel.routecontroller.initial-delay=0
camel.routecontroller.back-off-delay=5000
camel.routecontroller.back-off-max-attempts=0

# Traces go straight to box1-collector (box1-docs#132). While the site is disconnected the exporter's bounded
# in-memory queue (2048 spans) fills and further spans are dropped; nothing traced is part of the outbox.
quarkus.otel.exporter.otlp.endpoint=${BOX1_OTLP_ENDPOINT:http://box1-collector.box1-observability.svc:4317}
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.resource.attributes=site.id=${site.id},service.namespace=box1-sites
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none

# JSON logs to journald, with siteId; traceId and spanId come from the OpenTelemetry MDC. No secret is ever logged.
quarkus.log.console.json.additional-field."siteId".value=${site.id}
quarkus.log.console.json.additional-field."service".value=site-gateway
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."org.eclipse.paho".level=WARN

%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Tests run without PostgreSQL, Kafka or a broker (the CI task has no container runtime). The containers suite
# (tag "containers", -Pcontainers) overrides these with a test profile.
%test.site.id=site_ds9
%test.site.instance=site-west
%test.site.kafka.bootstrap-servers=localhost:1
%test.site.mqtt.enabled=false
%test.site.kafka.pick-list-enabled=false
%test.site.kafka.publisher-enabled=false
%test.site.agent.enabled=false
%test.gateway.readiness.database=false
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:1/site
%test.quarkus.datasource.password=test-only
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.otel.traces.exporter=none
