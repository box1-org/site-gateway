quarkus.application.name=ops
# Fast-jar (target/quarkus-app/), packaged as /ops/quarkus-app/ in the bundle.
quarkus.package.jar.type=fast-jar
# Modules run side by side in the consumer image: give each its own port at runtime.
quarkus.http.port=${HTTP_PORT:8080}
# Local by default: the pages have no login. Reach them with a tunnel (see the README), or set SITE_OPS_HOST=0.0.0.0
# only on a trusted site network.
quarkus.http.host=${SITE_OPS_HOST:127.0.0.1}
# Tests of different modules may run in parallel; use a random port.
quarkus.http.test-port=0

# The gateway's local API.
quarkus.rest-client.gateway.url=${SITE_GATEWAY_URL:http://127.0.0.1:8080}
quarkus.rest-client.gateway.connect-timeout=2000
quarkus.rest-client.gateway.read-timeout=10000

# Forms are protected against cross-site requests (double-submit cookie).
quarkus.rest-csrf.cookie-http-only=true
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Cache-Control".value=no-store

quarkus.log.console.json.additional-field."siteId".value=${BOX1_SITE_ID:unknown}
quarkus.log.console.json.additional-field."service".value=site-ops
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
