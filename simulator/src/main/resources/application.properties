quarkus.application.name=simulator
# Fast-jar (target/quarkus-app/), packaged as /simulator/quarkus-app/ in the bundle.
quarkus.package.jar.type=fast-jar
# Modules run side by side in the consumer image: give each its own port at runtime.
quarkus.http.port=${HTTP_PORT:8080}
# Local only: the scenario control is not for the network.
quarkus.http.host=${SITE_SIMULATOR_HOST:127.0.0.1}
# Tests of different modules may run in parallel; use a random port.
quarkus.http.test-port=0

simulator.site-id=${BOX1_SITE_ID}
# Interval between readings of every asset (box1-docs#127 buffer sizing assumes 5 s).
sim.interval=${SIMULATOR_INTERVAL:5s}

quarkus.otel.exporter.otlp.endpoint=${BOX1_OTLP_ENDPOINT:http://box1-collector.box1-observability.svc:4317}
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.resource.attributes=site.id=${simulator.site-id},service.namespace=box1-sites
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none
quarkus.log.console.json.additional-field."siteId".value=${simulator.site-id}
quarkus.log.console.json.additional-field."service".value=site-simulator
quarkus.log.category."org.eclipse.paho".level=WARN

%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
%test.simulator.site-id=site_spacedock
%test.simulator.enabled=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.otel.traces.exporter=none
